name: hcti-aws-storage-example
runtime: yaml
description: Configure an existing S3 bucket and IAM role.
config:
  bucket:
    type: string
  roleArn:
    type: string
variables:
  trust:
    fn::invoke:
      function: html-css-to-image:index:getAwsStorageExternalId
      arguments: {}
resources:
  hcti:
    type: pulumi:providers:html-css-to-image
    defaultProvider: true
    options:
      version: 0.1.1
      pluginDownloadURL: github://api.github.com/htmlcsstoimage/pulumi-html-css-to-image
  images:
    type: html-css-to-image:index:StorageDestination
    properties:
      name: S3 image storage
      connectionInfo:
        awsS3:
          bucket: ${bucket}
          region: us-east-1
          roleArn: ${roleArn}
outputs:
  externalId: ${trust.externalId}
  storageDestinationId: ${images.id}
