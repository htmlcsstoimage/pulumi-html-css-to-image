name: hcti-storage-example
runtime: yaml
description: Configure an existing Cloudflare R2 bucket for image storage.
config:
  accountId:
    type: string
  accessKeyId:
    type: string
  secretAccessKey:
    type: string
    secret: true
  bucket:
    type: string
resources:
  hcti:
    type: pulumi:providers:html-css-to-image
    defaultProvider: true
    options:
      version: 0.1.1
      pluginDownloadURL: github://api.github.com/htmlcsstoimage/pulumi-html-css-to-image
  images:
    type: html-css-to-image:index:StorageDestination
    properties:
      name: Image storage
      connectionInfo:
        cloudflareR2:
          bucket: ${bucket}
          cloudflareAccountId: ${accountId}
          accessKeyId: ${accessKeyId}
          secretAccessKey: ${secretAccessKey}
outputs:
  storageDestinationId: ${images.id}
