name: hcti-og-config-example
runtime: yaml
description: Manage website Open Graph images.
resources:
  hcti:
    type: pulumi:providers:html-css-to-image
    defaultProvider: true
    options:
      version: 0.1.1
      pluginDownloadURL: github://api.github.com/htmlcsstoimage/pulumi-html-css-to-image
  cards:
    type: html-css-to-image:index:OgConfig
    properties:
      name: Website cards
      configType: html_css
      baseUrl: https://example.com
      defaultOptions:
        viewportWidth: 1200
        viewportHeight: 630
outputs:
  domainId: ${cards.domainId}
