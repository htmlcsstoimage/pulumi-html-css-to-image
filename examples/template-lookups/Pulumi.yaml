name: hcti-template-lookups
runtime: yaml
description: Read an existing template and its recent version history.
config:
  templateId:
    type: string
resources:
  hcti:
    type: pulumi:providers:html-css-to-image
    defaultProvider: true
    options:
      version: 0.1.2
      pluginDownloadURL: github://api.github.com/htmlcsstoimage/pulumi-html-css-to-image
variables:
  template:
    fn::invoke:
      function: html-css-to-image:index:getTemplate
      arguments:
        id: ${templateId}
  history:
    fn::invoke:
      function: html-css-to-image:index:getTemplateVersions
      arguments:
        id: ${templateId}
        limit: 10
outputs:
  latestVersion: ${template.version}
  versions: ${history.versions}
