name: hcti-template-example
runtime: yaml
description: Manage an HTML/CSS template and its versions.
resources:
  hcti:
    type: pulumi:providers:html-css-to-image
    defaultProvider: true
    options:
      version: 0.1.0
      pluginDownloadURL: github://api.github.com/htmlcsstoimage/pulumi-html-css-to-image
  card:
    type: html-css-to-image:index:Template
    properties:
      name: Social card
      html: '<h1>{{title}}</h1>'
      css: 'h1 { font-family: Inter; padding: 48px; }'
      googleFonts:
        - Inter
outputs:
  templateId: ${card.id}
  templateVersion: ${card.version}
