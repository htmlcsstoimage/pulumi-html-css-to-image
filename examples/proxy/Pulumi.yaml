name: hcti-proxy-example
runtime: yaml
description: Manage an HTML/CSS to Image proxy with the local provider.
config:
  proxyPassword:
    type: string
    secret: true
resources:
  hcti:
    type: pulumi:providers:html-css-to-image
    defaultProvider: true
    options:
      version: 0.1.2
      pluginDownloadURL: github://api.github.com/htmlcsstoimage/pulumi-html-css-to-image
  rendering:
    type: html-css-to-image:index:Proxy
    properties:
      name: Rendering proxy
      url: https://proxy.example.com
      port: 8080
      authentication:
        username: rendering
        password: ${proxyPassword}
      bypassHosts:
        - static.example.com
outputs:
  proxyId: ${rendering.id}
