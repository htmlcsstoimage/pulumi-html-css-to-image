name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo 'VERSION must contain a semantic version such as 0.1.0 or 0.1.0-beta.1, without a v prefix.' >&2
            exit 1
          fi
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | [.tag_name, .draft] | @tsv')"
          while IFS=$'\t' read -r release_tag draft; do
            if [[ "$release_tag" == "$tag" && "$draft" == false ]]; then
              echo "$tag is already published; leaving it unchanged."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$releases"
          create_tag=true
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            create_tag=false
            if [[ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]]; then
              echo "$tag belongs to another commit. Rerun its original release workflow or bump VERSION." >&2
              exit 1
            fi
          fi
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: pulumi/actions@v6
        if: steps.version.outputs.publish == 'true'
        with:
          pulumi-version: '3.245.0'
      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        if: steps.version.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.publish == 'true'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: packaging/java/pom.xml
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - name: Build and verify SDK packages
        if: steps.version.outputs.publish == 'true'
        run: |
          make sdk
          git diff --exit-code -- internal/provider/schema.json
          bash scripts/package-sdks.sh
      - name: Create version tag
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "refs/tags/${TAG}"
      # Run here: tags created with GITHUB_TOKEN do not start another workflow.
      - name: Build release
        if: steps.version.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish npm package with trusted publishing
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/@html-css-to-image%2fpulumi/${version}")"
          case "$status" in
            200) echo "npm version ${version} already exists" ;;
            404)
              tag=latest
              [[ "$version" != *-* ]] || tag=next
              npm publish sdk/nodejs/bin --access public --provenance --tag "$tag"
              ;;
            *) echo "npm version lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
      - name: Publish Python package with trusted publishing
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true
      - name: NuGet trusted publishing login
        if: steps.version.outputs.publish == 'true'
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet package
        if: steps.version.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'sdk/dotnet/artifacts/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Check Maven Central version
        if: steps.version.outputs.publish == 'true'
        id: maven
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://repo.maven.apache.org/maven2/com/htmlcsstoimage/pulumi/${version}/pulumi-${version}.pom")"
          case "$status" in
            200) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Maven Central version lookup failed: HTTP $status" >&2; exit 1 ;;
          esac
      - name: Import Maven signing key
        if: steps.maven.outputs.publish == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Publish Java SDK to Maven Central
        if: steps.maven.outputs.publish == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -f sdk/java/pom.xml -Prelease deploy
      - name: Publish Go SDK branch and module tag
        if: steps.version.outputs.publish == 'true'
        run: bash scripts/publish-go-sdk.sh
      - name: Publish completed release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
