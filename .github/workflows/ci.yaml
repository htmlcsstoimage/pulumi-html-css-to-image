name: CI
on:
  push:
    branches-ignore: [sdk]
    tags-ignore: ['sdk/go/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          path: provider
      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Generate schema and build
        working-directory: provider
        run: |
          make build
          git diff --exit-code -- internal/provider/schema.json
      - name: Test
        working-directory: provider
        run: make test
      - name: Check schema generation across checkout names
        working-directory: provider
        run: bash scripts/test-schema-generation.sh
      - name: Vet
        working-directory: provider
        run: make vet
      - name: Test Go SDK publishing
        working-directory: provider
        run: bash scripts/test-publish-go-sdk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test release asset checks
        working-directory: provider
        run: node --test scripts/test-check-release-assets.mjs
      - name: Test NuGet publishing
        working-directory: provider
        run: node --test scripts/test-publish-nuget.mjs
  sdks:
    name: SDK / ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: [nodejs, python, dotnet, go, java]
    uses: ./.github/workflows/sdk.yaml
    with:
      language: ${{ matrix.language }}
      ref: ${{ github.sha }}
